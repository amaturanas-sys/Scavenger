name: Release

# Publica una version: el APK de Android (firmado) y el juego para Windows.
# Se lanza al subir una etiqueta vX.Y.Z o a mano (Actions > Release > Run workflow);
# a mano, la etiqueta sale de VERSION (vX.Y.Z) y se crea sobre el commit elegido.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip
      - name: Compilar y empaquetar el APK
        env:
          # Si el repo tiene una clave propia en los secrets, se usa; si no, la de desarrollo.
          ESTEPA_KEYSTORE_B64: ${{ secrets.ESTEPA_KEYSTORE_B64 }}
          ESTEPA_KEYSTORE_PASS: ${{ secrets.ESTEPA_KEYSTORE_PASS }}
          ESTEPA_KEY_ALIAS: ${{ secrets.ESTEPA_KEY_ALIAS }}
        run: |
          if [ -n "$ESTEPA_KEYSTORE_B64" ]; then
            echo "$ESTEPA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ESTEPA_KEYSTORE="$RUNNER_TEMP/release.keystore"
          else
            unset ESTEPA_KEYSTORE_PASS ESTEPA_KEY_ALIAS
          fi
          tools/android/build_apk.sh "build-android/scavengers-thrive-$(head -1 VERSION).apk"
      - name: Revisar el APK
        run: |
          APK="build-android/scavengers-thrive-$(head -1 VERSION).apk"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | tee badging.txt | head -5
          grep -E "^targetSdkVersion:'[0-9]+'$" badging.txt
          unzip -l "$APK" | grep -E "libestepa.so|texturas.png|inventario.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build-android/scavengers-thrive-*.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Tests del nucleo
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Empaquetar
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -First 1).Trim()
          New-Item -ItemType Directory -Force dist/ScavengersThrive | Out-Null
          Copy-Item build/Release/estepa.exe dist/ScavengersThrive/
          Copy-Item -Recurse build/Release/assets dist/ScavengersThrive/
          Compress-Archive -Path dist/ScavengersThrive -DestinationPath "dist/scavengers-thrive-$v-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/scavengers-thrive-*-windows.zip

  publicar:
    name: Publicar la release
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(head -1 VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          sed "s/@VERSION@/${VERSION}/g" tools/release/notas.md > notas.md
          ls -la dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Scavengers Thrive ${VERSION} — primera puesta en marcha" \
              --notes-file notas.md --latest
          fi
